[build-system]
requires = ["hatchling>=1.31"]
build-backend = "hatchling.build"

[project]
name = "oscal-agent-controls"
version = "0.1.0"
description = "Reference monitor and OSCAL evidence pipeline for synthetic agent controls."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "William Zujkowski" }]
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0.3",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[project.urls]
Homepage = "https://github.com/williamzujkowski/oscal-agent-controls"
"Documentation: Express controls as OSCAL" = "https://williamzujkowski.github.io/posts/2026-07-23-agent-controls-as-oscal/"
"Documentation: Prove the gate" = "https://williamzujkowski.github.io/posts/2026-07-30-prove-the-gate-not-the-agent/"

[tool.hatch.build.targets.wheel]
packages = ["gate", "pipeline"]

[tool.hatch.build.targets.sdist]
include = [
  "/gate",
  "/pipeline",
  "/tests",
  "/oscal",
  "/policy",
  "/verify",
  "/Makefile",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
