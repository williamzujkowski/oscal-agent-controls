name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -e '.[dev]'

      - name: Install Dafny
        run: |
          mkdir -p .tools
          curl -fsSL \
            https://github.com/dafny-lang/dafny/releases/download/v4.11.0/dafny-4.11.0-x64-ubuntu-22.04.zip \
            -o /tmp/dafny.zip
          echo "a46a9ff7cdd720f7955854c78e95df13f4cfe6b80691b05f8654fe19e8267179  /tmp/dafny.zip" | sha256sum -c -
          unzip -q /tmp/dafny.zip -d .tools/dafny-4.11.0
          mkdir -p verify/bin/dafny-4.11.0/dafny
          printf '%s\n' \
            '#!/usr/bin/env bash' \
            'set -euo pipefail' \
            'script_dir="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"' \
            'exec "$script_dir/../../../../.tools/dafny-4.11.0/dafny/dafny" "$@"' \
            > verify/bin/dafny-4.11.0/dafny/dafny
          chmod +x verify/bin/dafny-4.11.0/dafny/dafny

      - name: Install OPA
        run: |
          mkdir -p verify/bin
          curl -fsSL \
            https://github.com/open-policy-agent/opa/releases/download/v1.18.2/opa_linux_amd64_static \
            -o verify/bin/opa
          echo "9903e5125ac281104f2c4b7371d10cc3b74a98933743fcbfc174f9bf0ab20de8  verify/bin/opa" | sha256sum -c -
          chmod +x verify/bin/opa

      - name: Run pytest
        run: python -m pytest

      - name: Run pipeline verification
        run: make verify

      - name: Verify Dafny model
        run: verify/bin/dafny-4.11.0/dafny/dafny verify verify/Gate.dfy

      - name: Test Rego policy
        run: verify/bin/opa test verify/

      - name: Run differential test
        run: python verify/difftest/run.py
